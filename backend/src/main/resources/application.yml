server:
  # PORT is injected by hosts like Render/Railway; falls back to 8080 locally.
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: vygo-backend
  profiles:
    active: dev
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  # Real email delivery (SMTP). Defaults point at a local dev/null mail server;
  # for real sending set VYGO_MAIL_HOST/USERNAME/PASSWORD (e.g. Gmail app password)
  # and VYGO_EMAIL_ENABLED=true.
  mail:
    host: ${VYGO_MAIL_HOST:localhost}
    port: ${VYGO_MAIL_PORT:1025}
    username: ${VYGO_MAIL_USERNAME:}
    password: ${VYGO_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${VYGO_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${VYGO_MAIL_STARTTLS:true}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

app:
  secret: ${VYGO_JWT_SECRET:change-me-in-prod-this-is-a-very-long-secret-key-0123456789abcdef}
  access-token-ttl-minutes: 120
  refresh-token-ttl-days: 14
  seat-lock-ttl-minutes: 10
  cancellation-window-minutes: 60
  cancellation-fee-pct: 5.0
  qr-secret: ${VYGO_QR_SECRET:vygo-qr-signing-secret-0123456789}
  cors-allowed-origins: ${VYGO_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://localhost,capacitor://localhost,http://localhost,null}
  notifications:
    email-from: ${VYGO_EMAIL_FROM:noreply@vygo.lk}
    sms-enabled: ${VYGO_SMS_ENABLED:false}
    email-enabled: ${VYGO_EMAIL_ENABLED:false}
    # SMS gateway: blank | textlk | notifylk (free-trial accounts available).
    sms-provider: ${VYGO_SMS_PROVIDER:}
    sms-api-key: ${VYGO_SMS_API_KEY:}
    sms-sender-id: ${VYGO_SMS_SENDER_ID:}
    sms-user-id: ${VYGO_SMS_USER_ID:}
  # Self-hosted face verification (see face-service/). Disabled by default so the
  # rest of the app keeps working if the Python service is not running.
  face:
    enabled: ${VYGO_FACE_ENABLED:false}
    url: ${VYGO_FACE_URL:http://localhost:8100}
    match-threshold: ${VYGO_FACE_MATCH_THRESHOLD:0.40}
    require-liveness: ${VYGO_FACE_REQUIRE_LIVENESS:true}
  ai:
    llm:
      base-url: ${VYGO_LLM_BASE_URL:}
      api-key: ${VYGO_LLM_API_KEY:}
      model: ${VYGO_LLM_MODEL:gpt-4o-mini}
    perovin-url: ${VYGO_PEROVIN_URL:http://localhost:3000}
  download:
    apk-path: ${VYGO_APK_PATH:../android-v2/app/build/outputs/apk/release/app-release.apk}
    version: ${VYGO_APK_VERSION:2.0.3}

---
# ---------- dev profile: H2 file database (zero-install, persistent) ----------
# File-based H2 stores the database on disk at backend/data/vygo.mv.db so data
# survives across restarts, unlike the previous in-memory (jdbc:h2:mem:...) URL.
# AUTO_SERVER lets a second process (e.g. an IDE's H2 console) attach while the
# app holds the file lock. Path is relative to the JVM working directory.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/vygo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Colombo
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
# ---------- prod profile: MySQL 8 (via env vars) ----------
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${VYGO_DB_URL:jdbc:mysql://localhost:3306/vygo?useSSL=false&serverTimezone=Asia/Colombo&createDatabaseIfNotExist=true}
    username: ${VYGO_DB_USER:vygo}
    password: ${VYGO_DB_PASS:vygo}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
